server {
    listen      80;
    listen      [::]:80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;

    charset       utf-8;
    absolute_redirect off;

    # --- Healthcheck interno (no aparece en logs) -------------------------
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # --- index.html: NUNCA cachear -----------------------------------------
    # Si se cachea, el navegador seguiría pidiendo bundles viejos tras un deploy.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        expires -1;
        try_files $uri =404;
    }

    # --- Assets con hash en el nombre: caché agresiva ----------------------
    # Angular genera main.<hash>.js, styles.<hash>.css, etc. El nombre cambia
    # en cada build, así que son seguros de cachear indefinidamente.
    location ~* \.(?:js|css|woff2?|ttf|eot|otf|svg|png|jpe?g|gif|webp|avif|ico|map)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # --- Archivos de configuración raíz ------------------------------------
    location = /favicon.ico { access_log off; log_not_found off; try_files $uri =404; }
    location = /robots.txt  { access_log off; log_not_found off; try_files $uri =404; }

    # --- SPA: Angular Router ------------------------------------------------
    # Cualquier ruta que no corresponda a un archivo real se resuelve con
    # index.html y Angular se encarga del enrutado en cliente.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- Bloqueo de ficheros ocultos ---------------------------------------
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}

