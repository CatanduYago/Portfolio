<section id="sec0" class="section band-light">
  <span class="eyebrow">{{ 'HERO.EYEBROW' | translate }}</span>
  <h1 class="title">{{ 'HERO.TITLE' | translate }}</h1>
  <p class="hero-role">{{ 'HERO.ROLE' | translate }}</p>

  <div class="content-container">
    <div>
      <p>{{ 'HERO.DESCRIPTION' | translate }}</p>

      <div class="availability-container">
        <span class="availability-item">
          <img src="assets/location-icon.png" alt="" class="location-icon" />
          {{ 'HERO.LOCATION' | translate }}
        </span>
        <span class="availability-item">
          <img src="assets/green-dot.gif" alt="" class="availability-gif" />
          {{ 'HERO.STATUS' | translate }}
        </span>
      </div>

      <app-social-links></app-social-links>
    </div>

    <img [src]="profileImage" alt="Yago Catalano Andújar" id="profile" />
  </div>
</section>
