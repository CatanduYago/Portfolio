<div id="sec6" class="section">
  <h1 class="title-skills">{{ 'SKILLS.TITLE' | translate }}</h1>
  <p>{{ 'SKILLS.DESCRIPTION' | translate }}</p>

  <div class="skills-section">
    <div class="skill" *ngFor="let skill of skills">
      <img [src]="skill.image" alt="{{ skill.key | translate }}" class="skill-icon" loading="lazy" />
      <p>{{ skill.key | translate }}</p>
    </div>
  </div>
</div>
