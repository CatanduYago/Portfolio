<section id="sec6" class="section band-light">
  <h2 class="section-title">{{ 'SKILLS.TITLE' | translate }}</h2>
  <p class="section-lead">{{ 'SKILLS.DESCRIPTION' | translate }}</p>

  <div class="skills-group" *ngFor="let group of groups">
    <h3>{{ group.titleKey | translate }}</h3>

    <div class="skills-section" *ngIf="group.items.length">
      <div class="skill" *ngFor="let skill of group.items">
        <img
          [src]="skill.image"
          [alt]="skill.key | translate"
          class="skill-icon"
          loading="lazy"
        />
        <p>{{ skill.key | translate }}</p>
      </div>
    </div>
  </div>

  <div class="skills-group">
    <h3>{{ 'SKILLS.GROUPS.OTHER' | translate }}</h3>
    <div class="chip-row">
      <span class="chip" *ngFor="let item of otherSkills">{{ item }}</span>
    </div>
  </div>
</section>
