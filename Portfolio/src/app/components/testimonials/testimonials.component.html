<section id="sec3" class="section band-light">
  <h2 class="section-title">{{ 'TESTIMONIALS.TITLE' | translate }}</h2>
  <p class="section-lead">{{ 'TESTIMONIALS.DESCRIPTION' | translate }}</p>

  <div
    class="testimonials"
    [ngStyle]="{ 'grid-template-columns': 'repeat(' + testimonialsColumns + ', minmax(0, 1fr))' }"
  >
    <figure class="testimonials-item surface" *ngFor="let testimonial of testimonials">
      <a
        class="testimonial-image"
        [href]="testimonial.profile"
        target="_blank"
        rel="noopener noreferrer"
      >
        <img [src]="testimonial.image" [alt]="testimonial.name" />
      </a>
      <figcaption class="testimonials-details">
        <p class="testimonial-quote">{{ testimonial.textKey | translate }}</p>
        <p class="testimonial-name">{{ testimonial.name }}</p>
        <p class="testimonial-role">{{ testimonial.roleKey | translate }}</p>
      </figcaption>
    </figure>
  </div>
</section>
